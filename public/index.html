<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VideoGen Chat</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="app">
<header><div class="logo">🎬</div><div><h1>VideoGen Chat</h1><p>Describe it. JSON2Video renders it.</p></div></header>
<main id="chat"><div class="welcome"><h2>What do you want to create?</h2><p>Try: <b>“A cinematic basketball game winner in a packed stadium, with dramatic commentary.”</b></p></div></main>
<form id="form"><textarea id="prompt" placeholder="Describe your video..." rows="2"></textarea><button id="send" type="submit">Generate 🎬</button></form>
</div><script src="app.js"></script></body></html>
